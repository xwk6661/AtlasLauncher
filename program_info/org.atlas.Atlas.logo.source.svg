    <path d="M 256.00 256.00 L 102.28 167.25 L 102.28 344.75 L 256.00 433.50 Z" fill="url(#grad-cube-left)"/>
    <path d="M 256.00 256.00 L 409.72 167.25 L 409.72 344.75 L 256.00 433.50 Z" fill="url(#grad-cube-right)"/>
    <path d="M 256.00 256.00 L 102.28 167.25 L 256.00 78.50 L 409.72 167.25 Z" fill="url(#grad-cube-top)"/>
  </g>
  <path d="M 266.45 120.03 L 368.52 178.97 Q 378.98 185.00 378.98 197.07 L 378.98 314.93 Q 378.98 327.00 368.52 333.04 L 266.45 391.96 Q 256.00 398.00 245.55 391.96 L 143.48 333.04 Q 133.02 327.00 133.02 314.93 L 133.02 197.07 Q 133.02 185.00 143.48 178.97 L 245.55 120.03 Q 256.00 114.00 266.45 120.03 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.2"/>

