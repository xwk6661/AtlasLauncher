  <path d="M 267.46 123.61 L 371.85 183.88 Q 383.31 190.50 383.31 203.73 L 383.31 324.27 Q 383.31 337.50 371.85 344.12 L 267.46 404.38 Q 256.00 411.00 244.54 404.38 L 140.15 344.12 Q 128.69 337.50 128.69 324.27 L 128.69 203.73 Q 128.69 190.50 140.15 183.88 L 244.54 123.61 Q 256.00 117.00 267.46 123.61 Z" fill="#0B1324" fill-opacity="0.22"/>
  <path d="M 267.22 122.48 L 369.48 181.52 Q 380.71 188.00 380.71 200.96 L 380.71 319.04 Q 380.71 332.00 369.48 338.48 L 267.22 397.52 Q 256.00 404.00 244.78 397.52 L 142.52 338.48 Q 131.29 332.00 131.29 319.04 L 131.29 200.96 Q 131.29 188.00 142.52 181.52 L 244.78 122.48 Q 256.00 116.00 267.22 122.48 Z" fill="#0B1324" fill-opacity="0.20"/>

