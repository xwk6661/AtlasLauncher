    <path d="M 488 216 L 488 488 L 204 488 L 256 420 L 316 392 L 364 334 L 424 294 Z" fill="url(#grad-shallow-sea)" fill-opacity="0.52"/>
    <path d="M 488 264 L 488 488 L 258 488 L 304 434 L 358 408 L 398 354 L 444 324 Z" fill="url(#grad-land-sand)" fill-opacity="0.95"/>
