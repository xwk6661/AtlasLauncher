    <rect x="24" y="24" width="154" height="464" fill="#FFFFFF" fill-opacity="0.035"/>
    <rect x="178" y="24" width="156" height="464" fill="#0A1324" fill-opacity="0.055"/>
    <rect x="334" y="24" width="154" height="464" fill="#FFFFFF" fill-opacity="0.025"/>

    <!-- Cartographic Compass Degree Ring -->
    <circle cx="256" cy="256" r="184" fill="none" stroke="#E8C674" stroke-width="2" stroke-opacity="0.45"/>
    <line x1="440.00" y1="256.00" x2="454.00" y2="256.00" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="433.73" y1="303.62" x2="441.46" y2="305.69" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
