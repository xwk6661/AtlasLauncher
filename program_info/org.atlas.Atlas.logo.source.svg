    <line x1="348.00" y1="415.35" x2="352.00" y2="422.28" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="303.62" y1="433.73" x2="305.69" y2="441.46" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="256.00" y1="440.00" x2="256.00" y2="454.00" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="208.38" y1="433.73" x2="206.31" y2="441.46" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="164.00" y1="415.35" x2="160.00" y2="422.28" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="125.89" y1="386.11" x2="115.99" y2="396.01" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="96.65" y1="348.00" x2="89.72" y2="352.00" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="78.27" y1="303.62" x2="70.54" y2="305.69" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="72.00" y1="256.00" x2="58.00" y2="256.00" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="78.27" y1="208.38" x2="70.54" y2="206.31" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="96.65" y1="164.00" x2="89.72" y2="160.00" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="125.89" y1="125.89" x2="115.99" y2="115.99" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="164.00" y1="96.65" x2="160.00" y2="89.72" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="208.38" y1="78.27" x2="206.31" y2="70.54" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="256.00" y1="72.00" x2="256.00" y2="58.00" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="303.62" y1="78.27" x2="305.69" y2="70.54" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="348.00" y1="96.65" x2="352.00" y2="89.72" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="386.11" y1="125.89" x2="396.01" y2="115.99" stroke="#E8C674" stroke-width="3.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="415.35" y1="164.00" x2="422.28" y2="160.00" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="433.73" y1="208.38" x2="441.46" y2="206.31" stroke="#E8C674" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>

