      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F2E8"/>
    </linearGradient>
    <linearGradient id="grad-cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
