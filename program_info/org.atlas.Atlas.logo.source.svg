      <path d="M 256.00 256.00 L 306.91 306.91 L 256.00 273.00 Z" fill="#C2963F"/>
      <path d="M 256.00 256.00 L 205.09 306.91 L 256.00 273.00 Z" fill="#C2963F"/>
      <path d="M 256.00 256.00 L 205.09 306.91 L 239.00 256.00 Z" fill="#E8C26B"/>
      <path d="M 256.00 256.00 L 205.09 205.09 L 239.00 256.00 Z" fill="#C2963F"/>
      <path d="M 256.00 256.00 L 205.09 205.09 L 256.00 239.00 Z" fill="#E8C26B"/>
    </g>

    <!-- Primary 4-point Compass Rose (North Crimson, E/S/W Deep Atlas Navy) -->
    <g id="compass-primary">
      <!-- West -->
      <path d="M 256.00 256.00 L 154.00 256.00 L 236.55 236.55 Z" fill="#3E5A85"/>
      <path d="M 256.00 256.00 L 154.00 256.00 L 236.55 275.45 Z" fill="#223452"/>
      <!-- East -->
      <path d="M 256.00 256.00 L 358.00 256.00 L 275.45 236.55 Z" fill="#3E5A85"/>
      <path d="M 256.00 256.00 L 358.00 256.00 L 275.45 275.45 Z" fill="#223452"/>
      <!-- South -->
      <path d="M 256.00 256.00 L 256.00 368.00 L 236.55 275.45 Z" fill="#3E5A85"/>
      <path d="M 256.00 256.00 L 256.00 368.00 L 275.45 275.45 Z" fill="#223452"/>
