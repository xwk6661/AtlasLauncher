      <stop offset="0%" stop-color="#F2D488" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#C79E4C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#E6C26E" stop-opacity="0.65"/>
