<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AtlasLauncher Icon">
  <title>AtlasLauncher</title>
  <defs>
    <!-- Modern rounded-square app icon tile (completely distinct from Prism Launcher's hexagon) -->
    <clipPath id="clip-app-tile">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108"/>
    </clipPath>
    <clipPath id="clip-inner-cube">
      <path d="M 266.45 120.03 L 368.52 178.97 Q 378.98 185.00 378.98 197.07 L 378.98 314.93 Q 378.98 327.00 368.52 333.04 L 266.45 391.96 Q 256.00 398.00 245.55 391.96 L 143.48 333.04 Q 133.02 327.00 133.02 314.93 L 133.02 197.07 Q 133.02 185.00 143.48 178.97 L 245.55 120.03 Q 256.00 114.00 266.45 120.03 Z"/>
    </clipPath>

    <!-- Deep Atlas Ocean & Cartographic Backdrop Gradients -->
    <linearGradient id="grad-ocean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223A61"/>
      <stop offset="55%" stop-color="#1C3154"/>
      <stop offset="100%" stop-color="#14223D"/>
    </linearGradient>

    <!-- Stylized Minecraft Map Biome Terraces -->
    <linearGradient id="grad-shallow-sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B7AA"/>
      <stop offset="100%" stop-color="#2B7FA8"/>
    </linearGradient>
    <linearGradient id="grad-land-sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C472"/>
      <stop offset="100%" stop-color="#C89B4C"/>
    </linearGradient>
    <linearGradient id="grad-land-grass" x1="0%" y1="0%" x2="100%" y2="100%">
